name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

env:
    ZIPLAC_URL: https://github.com/ci7lus/ziplac/releases/download/v0.1.0/ziplac-linux-amd64

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        outputs:
            has_releases: ${{ steps.release_targets.outputs.has_releases }}
            release_plugins: ${{ steps.release_targets.outputs.release_plugins }}
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11
                  run_install: false
                  cache: true

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm type

            - name: Test
              run: pnpm test

            - name: Find unreleased plugin versions
              id: release_targets
              if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              run: |
                  release_plugins="$(pnpm --silent release:targets)"
                  echo "release_plugins=$release_plugins" >> "$GITHUB_OUTPUT"

                  if [ -n "$release_plugins" ]; then
                    echo "has_releases=true" >> "$GITHUB_OUTPUT"
                    echo "Releasing plugins: $release_plugins"
                  else
                    echo "has_releases=false" >> "$GITHUB_OUTPUT"
                    echo "All plugin versions in the manifest are already published."
                  fi

            - name: Install ziplac
              if: ${{ steps.release_targets.outputs.has_releases == 'true' }}
              run: |
                  install -m 700 -d "$RUNNER_TEMP/bin"
                  curl -fsSL "$ZIPLAC_URL" -o "$RUNNER_TEMP/bin/ziplac"
                  chmod +x "$RUNNER_TEMP/bin/ziplac"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Prepare signing files
              if: ${{ steps.release_targets.outputs.has_releases == 'true' }}
              env:
                  SIGN_CRT: ${{ secrets.SIGN_CRT }}
                  SIGN_KEY: ${{ secrets.SIGN_KEY }}
              run: |
                  if [ -z "$SIGN_CRT" ] || [ -z "$SIGN_KEY" ]; then
                    echo "SIGN_CRT and SIGN_KEY secrets must both be set to sign plugin packages." >&2
                    exit 1
                  fi

                  signing_dir="$RUNNER_TEMP/kiririn-plugin-signing"
                  install -m 700 -d "$signing_dir"
                  printf '%s' "$SIGN_CRT" > "$signing_dir/signer.crt"
                  printf '%s' "$SIGN_KEY" > "$signing_dir/signer.key"
                  chmod 600 "$signing_dir/signer.crt" "$signing_dir/signer.key"

                  echo "SIGN_CRT_PATH=$signing_dir/signer.crt" >> "$GITHUB_ENV"
                  echo "SIGN_KEY_PATH=$signing_dir/signer.key" >> "$GITHUB_ENV"

            - name: Build
              if: ${{ steps.release_targets.outputs.has_releases != 'true' }}
              run: pnpm build

            - name: Build (with uploading source maps to Sentry)
              if: ${{ steps.release_targets.outputs.has_releases == 'true' }}
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
              run: pnpm build -- "${{ steps.release_targets.outputs.release_plugins }}"

            - name: Upload dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  if-no-files-found: error

    release:
        name: Release
        needs: build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.has_releases == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            attestations: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Download dist artifact
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: release-assets

            - name: Prepare release metadata
              id: release_meta
              run: |
                  release_tag="$(date -u +'%Y%m%d%H%M%S')"
                  echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release create --repo "$GH_REPO" "${{ steps.release_meta.outputs.tag }}" \
                    --title "${{ steps.release_meta.outputs.tag }}" \
                    --generate-notes \
                    release-assets/*.kppx

            - name: Generate artifact attestation
              uses: actions/attest@v4
              with:
                  subject-path: release-assets/*.kppx

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11
                  run_install: false
                  cache: true

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Update release metadata
              run: >-
                  pnpm release:update
                  "${{ steps.release_meta.outputs.tag }}"
                  "${{ github.repository }}"
                  release-assets

            - name: Create update manifest pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PLUGINS: ${{ needs.build.outputs.release_plugins }}
                  RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
              run: |
                  branch="release/update-$RELEASE_TAG"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git add update.json
                  git commit -m "Update plugin releases for $RELEASE_TAG"
                  git push --set-upstream origin "$branch"
                  gh pr create \
                    --base "$GITHUB_REF_NAME" \
                    --head "$branch" \
                    --title "Update plugin releases for $RELEASE_TAG" \
                    --body "Adds update metadata for release $RELEASE_TAG ($RELEASE_PLUGINS)."
